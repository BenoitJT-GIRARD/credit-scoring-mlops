name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: credexp
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d credexp"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/credexp
      API_HOST: 127.0.0.1
      API_PORT: 8000
      PROMETHEUS_ENABLED: "false"
      MLFLOW_TRACKING_URI: sqlite:///mlflow/mlflow.db
      MLFLOW_REGISTRY_URI: sqlite:///mlflow/mlflow.db
      MLFLOW_ARTIFACT_ROOT: mlflow/artifacts
      MODEL_URI: models:/credit_scoring_model/Production
      EVIDENTLY_REFERENCE_PATH: data/processed/reference.parquet

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v8

      - name: Install Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: >
          uv sync
          --group dev
          --group data
          --group ml
          --group mlops
          --group serve
          --group db
          --group monitoring

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Run tests
        run: uv run pytest -q

  docker-build:
    runs-on: ubuntu-latest
    needs: quality-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate docker compose file
        run: docker compose config

      - name: Build API image
        run: docker build -f docker/api.Dockerfile -t credexp-api:ci .
