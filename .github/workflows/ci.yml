name: ci

# Manual since 2026-09-18. What proves the pipeline is the recorded run, not a badge.
on:
  workflow_dispatch:

jobs:
  quality-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: credexp
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d credexp"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/credexp
      API_HOST: 127.0.0.1
      API_PORT: 8000
      # `true`, as config.py and .env.example both ship it. Set to false, the app drops
      # its /metrics route, and four tests of tests/integration/test_serving_metrics.py
      # then assert against a 404: the environment was contradicting the suite.
      PROMETHEUS_ENABLED: "true"
      MODEL_LOAD_MODE: joblib
      MODEL_NAME: credit_scoring_model
      MODEL_VERSION: ci-joblib
      MODEL_JOBLIB_PATH: models/pipeline.joblib
      THRESHOLD_PATH: models/threshold.json
      FEATURE_COLUMNS_PATH: models/feature_columns.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      - name: Install Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: >
          uv sync --frozen
          --group dev
          --group data
          --group ml
          --group mlops
          --group serve
          --group db
          --group monitoring
          --group perf

      - name: Show tool versions
        run: |
          uv --version
          uv run python --version
          uv run ruff --version

      # No autofix step here. Fixing the code and then checking it means the check can
      # never fail on anything fixable — which is how six import-ordering errors sat in
      # the repository under a green pipeline.
      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Run tests
        run: uv run pytest -q

  docker-build:
    runs-on: ubuntu-latest
    needs: quality-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate docker compose file
        run: docker compose config

      - name: Build local API image
        run: docker build -f infra/api.Dockerfile -t credexp-api:ci .
