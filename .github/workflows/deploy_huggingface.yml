name: deploy-huggingface

# Manual only: the Hugging Face Space this deploys to has been decommissioned, so every
# run would fail. Kept because it documents how the deployment worked.
on:
  workflow_dispatch:

jobs:
  test-build-and-deploy:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: credexp
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d credexp"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/credexp
      API_HOST: 127.0.0.1
      API_PORT: 8000
      PROMETHEUS_ENABLED: "false"
      MODEL_LOAD_MODE: joblib
      MODEL_NAME: credit_scoring_model
      MODEL_VERSION: hf-space
      MODEL_JOBLIB_PATH: artifacts/models/pipeline.joblib
      THRESHOLD_PATH: artifacts/models/threshold.json
      FEATURE_COLUMNS_PATH: artifacts/models/feature_columns.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      - name: Install Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: >
          uv sync --frozen
          --group dev
          --group data
          --group ml
          --group mlops
          --group serve
          --group db
          --group monitoring
          --group perf

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Run tests
        run: uv run pytest -q

      - name: Validate model artifacts
        run: |
          test -f artifacts/models/pipeline.joblib
          test -f artifacts/models/threshold.json
          test -f artifacts/models/feature_columns.json

      - name: Build Hugging Face Docker image
        run: docker build -f deploy/huggingface/Dockerfile -t credexp-hf-space:ci .

      - name: Prepare Hugging Face Space folder
        run: |
          rm -rf _hf_space
          mkdir -p _hf_space

          cp deploy/huggingface/README.md _hf_space/README.md
          cp deploy/huggingface/Dockerfile _hf_space/Dockerfile

          mkdir -p _hf_space/deploy/huggingface
          cp deploy/huggingface/nginx.conf _hf_space/deploy/huggingface/nginx.conf
          cp deploy/huggingface/start.sh _hf_space/deploy/huggingface/start.sh

          cp pyproject.toml _hf_space/pyproject.toml
          cp uv.lock _hf_space/uv.lock
          cp README.md _hf_space/README.github.md

          cp -r src _hf_space/src
          cp -r scripts _hf_space/scripts
          cp -r streamlit_app _hf_space/streamlit_app

          mkdir -p _hf_space/artifacts
          cp -r artifacts/models _hf_space/artifacts/models

      - name: Validate Space folder
        run: |
          test -f _hf_space/README.md
          test -f _hf_space/Dockerfile
          test -f _hf_space/artifacts/models/pipeline.joblib
          test -f _hf_space/artifacts/models/threshold.json
          test -f _hf_space/artifacts/models/feature_columns.json
          find _hf_space -maxdepth 3 -type f | sort | head -50

      - name: Install Hugging Face Hub
        run: pip install huggingface_hub==1.31.0

      - name: Upload to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ secrets.HF_SPACE_ID }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])
          api.upload_folder(
              repo_id=os.environ["HF_SPACE_ID"],
              repo_type="space",
              folder_path="_hf_space",
              commit_message="Deploy from GitHub Actions",
          )
          PY
