# The Streamlit theme of the demonstration interface: the landing page, the scoring form and
# the decision log.
#
# Without this file the buttons and the sliders ship Streamlit's factory colour, next to
# charts drawn in blue and amber. Every value below is taken from the module the figures
# read, and tests/unit/test_theme.py checks it against that module, so a colour is still
# decided in exactly one place.

[theme]
# The brand anchor, and not the amber. Amber is a SERIES colour in the figures: using it as
# the action colour would put the same hue on a button and on a curve of the same page, where
# it would no longer mean anything.
primaryColor = "#123F5A"

backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F5F6"
textColor = "#1B1F23"
font = "sans serif"

[client]
# The editor toolbar — "Deploy", the three-dot menu — is not part of the product, and it was
# in the two published screenshots of these pages.
toolbarMode = "minimal"
showErrorDetails = true

[server]
# These pages read versioned artefacts and ask an API. They have nothing to receive.
enableXsrfProtection = true
maxUploadSize = 1

[browser]
gatherUsageStats = false
