services:
  db:
    image: postgres:16
    container_name: credexp_db
    environment:
      POSTGRES_DB: credexp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: credexp_api
    depends_on:
      - db
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8000
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/credexp
      MODEL_LOAD_MODE: joblib
      MODEL_NAME: credit_scoring_model
      MODEL_VERSION: local-joblib
      MODEL_JOBLIB_PATH: /app/artifacts/models/pipeline.joblib
      THRESHOLD_PATH: /app/artifacts/models/threshold.json
      FEATURE_COLUMNS_PATH: /app/artifacts/models/feature_columns.json
      PROMETHEUS_ENABLED: "true"
    ports:
      - "8000:8000"

  streamlit:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: credexp_streamlit
    depends_on:
      - api
      - db
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/credexp
      API_BASE_URL: http://api:8000
    command: ["uv", "run", "streamlit", "run", "streamlit_app/Overview.py", "--server.address", "0.0.0.0", "--server.port", "8501"]
    ports:
      - "8501:8501"

  prometheus:
    build:
      context: .
      dockerfile: docker/prometheus.Dockerfile
    container_name: credexp_prometheus
    depends_on:
      - api
    ports:
      - "9090:9090"

  grafana:
    build:
      context: .
      dockerfile: docker/grafana.Dockerfile
    container_name: credexp_grafana
    depends_on:
      - prometheus
    environment:
      # The stack is a local demonstration: the dashboard has to open without a login,
      # or the first thing a reader meets is a password prompt for an account nobody owns.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_BASIC_ENABLED: "false"
      GF_USERS_DEFAULT_THEME: dark
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/serving.json
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  postgres_data:
  grafana_data:
