services:
  db:
    image: postgres:16
    container_name: credexp_db
    environment:
      POSTGRES_DB: credexp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d credexp"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: infra/api.Dockerfile
    container_name: credexp_api
    depends_on:
      db:
        condition: service_healthy
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8000
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/credexp
      MODEL_LOAD_MODE: joblib
      MODEL_NAME: credit_scoring_model
      MODEL_VERSION: local-joblib
      MODEL_JOBLIB_PATH: /app/models/pipeline.joblib
      THRESHOLD_PATH: /app/models/threshold.json
      FEATURE_COLUMNS_PATH: /app/models/feature_columns.json
      PROMETHEUS_ENABLED: "true"
    ports:
      - "8000:8000"

  streamlit:
    build:
      context: .
      dockerfile: infra/api.Dockerfile
    container_name: credexp_streamlit
    depends_on:
      api:
        condition: service_healthy
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/credexp
      API_BASE_URL: http://api:8000
    command: ["uv", "run", "streamlit", "run", "src/credexp/app/Overview.py", "--server.address", "0.0.0.0", "--server.port", "8501"]
    ports:
      - "8501:8501"

  prometheus:
    build:
      context: .
      dockerfile: infra/prometheus.Dockerfile
    container_name: credexp_prometheus
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
    ports:
      - "9090:9090"

  grafana:
    build:
      context: .
      dockerfile: infra/grafana.Dockerfile
    container_name: credexp_grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    environment:
      # The stack is a local demonstration: the dashboard has to open without a login,
      # or the first thing a reader meets is a password prompt for an account no one owns.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_BASIC_ENABLED: "false"
      GF_USERS_DEFAULT_THEME: dark
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/serving.json
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  postgres_data:
  grafana_data:
