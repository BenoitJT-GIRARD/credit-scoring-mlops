[project]
name = "credexp"
version = "0.1.0"
description = "Credit default model served behind an API, with monitoring, drift watch and decision analysis."
readme = "README.md"
authors = [
    { name = "Benoît J. T. GIRARD", email = "53222414+BenoitJT-GIRARD@users.noreply.github.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "setuptools<70",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/credexp"]

[dependency-groups]
data = [
    "matplotlib>=3.10.8",
    "missingno>=0.5.2",
    "numpy>=1.26,<2.0",
    "pandas>=2.1,<3.0",
    "pyarrow>=23.0.1",
    "seaborn>=0.13.2",
]
db = [
    "psycopg[binary]>=3.3.2",
    "sqlalchemy>=2.0.46",
]
dev = [
    "bandit>=1.9.3",
    "httpx>=0.28.1",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "python-dotenv>=1.2.1",
    "ruff>=0.15.1",
]
ml = [
    "imbalanced-learn>=0.14.1",
    "lightgbm>=4.6.0",
    "scikit-learn>=1.8.0",
]
mlops = [
    "evidently>=0.7.20",
    "mlflow==3.10.0",
    "optuna>=4.7.0",
    "shap>=0.45",
]
monitoring = [
    "prometheus-client>=0.24.1",
    "prometheus-fastapi-instrumentator>=7.1.0",
]
notebook = [
    "ipykernel>=7.2.0",
    "jupyterlab>=4.5.4",
]
perf = [
    "onnxmltools>=1.16.0",
    "onnxruntime>=1.24.1",
]
serve = [
    "fastapi>=0.129.0",
    "pydantic>=2.12.5",
    "streamlit>=1.56.0,<2.0",
    "uvicorn[standard]>=0.41.0",
]


[tool.ruff]
line-length = 100
# `var/` holds what a run leaves behind. Nothing else is excluded: a notebook is code a
# reader reads, and excluding it from the linter is how four of its cells came to carry
# French titles and a second answer to where the project root is.
extend-exclude = ["var"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# A notebook spreads its imports across cells: the first one sets the environment up, and
# the ones that follow sit next to the code that uses them, which is what makes a notebook
# readable in order.
"notebooks/**/*.ipynb" = ["E402", "F401", "I001", "B018"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --cov --cov-branch --cov-report=term-missing --cov-report=xml"
markers = [
    "integration: two real components of the repository wired together, or one against a real external dependency",
    "system: the product started the way the README says to start it, questioned through its public surface",
    "claim: fails when a published number, figure, table or artefact stops matching the code",
    "simulation: replays a complete scenario on frozen data, with no real service",
    "slow: takes long enough that a reader deserves to be told before running it",
]
# Warnings are errors. Each exemption names the message it silences and the dependency it
# comes from; nothing here silences a whole category.
filterwarnings = [
    "error",
    # protobuf calls datetime.utcfromtimestamp at import time, reached through mlflow's
    # entity module. Raising there kills collection before a single test runs.
    "ignore:datetime.datetime.utcfromtimestamp:DeprecationWarning",
    # scikit-learn, on every prediction made with the shipped pipeline. `SimpleImputer`
    # hands the classifier a bare array, and the classifier was fitted with column names,
    # so it says so once per call. What keeps the prediction right is the order, and
    # `models/feature_columns.json` is that order: `tests/integration/test_api.py` pins it
    # by shuffling the columns and watching the score move. The model is frozen and cannot
    # be refitted without the Home Credit data, so the warning is named here rather than
    # made to disappear.
    "ignore:X does not have valid feature names:UserWarning",
    # Evidently 0.7 ships a docstring holding an unescaped regular expression, and Python
    # compiles it to a SyntaxWarning. As an error it stops the import, so nothing under
    # `credexp.monitoring` could be tested at all: the drift code had no coverage, and the
    # reason was not that nobody had written the tests.
    "ignore:invalid escape sequence:SyntaxWarning",
]

[tool.coverage.run]
# Without this, the published XML report writes the absolute root of the measured sources:
# a reader finds the directory tree of the machine that ran the suite, and two runs on two
# machines produce two different files for the same numbers.
relative_files = true
branch = true
source = ["src", "scripts"]
data_file = "var/.coverage"

[tool.coverage.report]
# The floor is the rate measured on the day the suite was completed, rounded down. A floor
# below the current rate is not a floor: it lets the next commit lose coverage silently.
fail_under = 37
show_missing = true
skip_covered = true

[tool.coverage.xml]
# Tracked: a published result a reader can open, and what the coverage badge recomputes from.
output = "reports/coverage/coverage.xml"

[tool.coverage.html]
# Not tracked: generated pages nobody reviews in a diff.
directory = "var/coverage-html"

[tool.bandit]
targets = ["src/credexp"]
exclude_dirs = [".venv", "tests", "notebooks", "var"]
